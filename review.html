<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<title>Review | DXB Food Diary</title>
<meta name="description" content="Honest restaurant review from DXB Food Diary.">
<style>
:root{--bar:#111111;--silver:#C8CACE;--blue:#0B3FB5;--ink:#1a1a1a;--mute:#6b6b66;--line:#e6e4de;--sand:#f5f3ee;--star:#d6a53c;--maxw:1100px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"DM Sans",system-ui,sans-serif;color:var(--ink);background:#fff;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 20px}
.serif{font-family:"DM Serif Display",Georgia,serif;font-weight:400}
header{position:sticky;top:0;background:var(--bar);color:var(--silver);z-index:10}
.nav{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:60px}
.brand{font-size:15px;letter-spacing:.22em;text-transform:uppercase;font-weight:700;color:var(--silver);grid-column:2;text-align:center;white-space:nowrap}
.nav ul{display:flex;gap:24px;list-style:none;font-size:14px;color:rgba(200,202,206,.7);grid-column:3;justify-self:end}
.nav ul a:hover{color:var(--silver)}
.burger{display:none;background:none;border:0;font-size:22px;cursor:pointer;color:var(--silver);grid-column:3;justify-self:end}
html{scroll-behavior:auto}
section[id]{scroll-margin-top:70px}
.hero{padding:56px 0 40px;text-align:center}
.hero h1.typing::after{content:"|";margin-left:2px;animation:hblink 1s steps(1) infinite}@keyframes hblink{50%{opacity:0}}.hero h1{font-family:"DM Serif Display",Georgia,serif;font-weight:400;font-size:clamp(30px,5.5vw,56px);line-height:1.1;letter-spacing:-.02em;max-width:760px;margin:0 auto}
.search{margin:28px auto 0;display:flex;max-width:520px;border:1px solid var(--ink);border-radius:999px;overflow:hidden}
.search input{flex:1;border:0;padding:14px 20px;font:inherit;font-size:15px;outline:none}
.search button{border:0;background:var(--ink);color:#fff;padding:0 22px;font:inherit;font-size:14px;cursor:pointer}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.chip{font-size:13px;padding:6px 14px;border:1px solid var(--line);border-radius:999px;color:var(--mute)}
.chip:hover{border-color:var(--ink);color:var(--ink)}
.sec{padding:40px 0;border-top:1px solid var(--line)}
.hero+.sec{border-top:0;padding-top:8px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:22px}
.sec-head h2{font-size:30px}
.sec-head a{font-size:13px;color:var(--mute);border-bottom:1px solid var(--line)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:28px 24px}
.card .ph{aspect-ratio:4/3;background:var(--sand);border-radius:6px;overflow:hidden}
.card .ph img{width:100%;height:100%;object-fit:cover;transition:transform .4s}
.card:hover .ph img{transform:scale(1.03)}
.card h3{font-size:17px;font-weight:500;margin-top:12px}
.meta{font-size:13px;color:var(--mute);margin-top:2px}
.stars{color:var(--star);letter-spacing:1px}
.guides{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.guide{padding:24px;background:var(--sand) center/cover no-repeat;border-radius:8px;display:flex;justify-content:space-between;align-items:flex-end;min-height:220px;position:relative;overflow:hidden;color:#fff}
.guide::before{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.65),rgba(0,0,0,0) 60%)}
.guide h3,.guide span{position:relative}
.guide h3{font-size:26px;max-width:280px;line-height:1.1}
.guide span{font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.areas{display:flex;flex-wrap:wrap;gap:10px}
.area{padding:10px 18px;border:1px solid var(--line);border-radius:6px;font-size:14px}
.area small{color:var(--mute);margin-left:6px}
footer{border-top:1px solid var(--line);padding:40px 0;font-size:13px;color:var(--mute);display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px}
/* review page */
.rev{max-width:720px;margin:0 auto;padding:48px 20px}
.crumb{font-size:13px;color:var(--mute)}
.rev h1{font-size:clamp(36px,6vw,56px);line-height:1.05;margin-top:12px;letter-spacing:-.02em}
.rev .sub{display:flex;gap:14px;flex-wrap:wrap;color:var(--mute);font-size:14px;margin-top:10px;align-items:center}
.facts{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:8px;margin:28px 0;overflow:hidden}
.fact{padding:14px 16px;border-right:1px solid var(--line)}
.fact:last-child{border-right:0}
.fact small{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.fact b{font-weight:500;font-size:15px}
.gallery{display:grid;grid-template-columns:2fr 1fr;gap:8px;margin:24px 0}
.gallery div{background:var(--sand);border-radius:6px;aspect-ratio:4/3}
.gallery .tall{grid-row:span 2;aspect-ratio:auto}
.prose{font-size:17px;line-height:1.75}
.prose p{margin:0 0 20px}
.prose h2{font-size:26px;margin:36px 0 12px}
.order{background:var(--sand);border-radius:8px;padding:20px 24px;margin:28px 0}
.order h3{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin-bottom:10px}
.order li{margin-left:18px;margin-bottom:6px}
.verdict{border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);padding:24px 0;margin:36px 0;display:flex;justify-content:space-between;align-items:center;gap:20px}
.verdict .serif{font-size:26px}
.verdict .stars{font-size:22px}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btn{padding:12px 20px;border:1px solid var(--ink);border-radius:999px;font-size:14px}
.btn.solid{background:var(--ink);color:#fff}
.map{background:var(--sand);border-radius:8px;height:220px;display:flex;align-items:center;justify-content:center;color:var(--mute);font-size:14px;margin-top:28px;overflow:hidden}
.leaflet-container{font-family:"DM Sans",sans-serif}.leaflet-popup-content{font-size:13px;margin:10px 14px}.leaflet-popup-content b{display:block;font-size:14px}.leaflet-popup-content-wrapper{border-radius:8px;box-shadow:0 2px 12px rgba(0,0,0,.12)}.pin{width:14px;height:14px;border-radius:50%;background:#1a1a1a;border:2.5px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.about{display:grid;grid-template-columns:160px 1fr;gap:28px;align-items:center}.about-ph{width:160px;height:160px;border-radius:50%;background:var(--sand)}.about h2{font-size:30px}
.related{margin-top:48px}
.related h2{font-size:24px;margin-bottom:16px}
.hidden{display:none}
@media (max-width:760px){.hero h1{white-space:pre-line}
 .nav ul{display:none;position:absolute;top:60px;left:0;right:0;background:var(--bar);flex-direction:column;gap:0;padding:8px 0}
 .nav ul.open{display:flex}
 .nav ul li a{display:block;padding:14px 20px;font-size:16px;color:var(--silver)}
 .burger{display:block}
 .grid{grid-template-columns:repeat(2,1fr);gap:20px 14px}
 .guides{grid-template-columns:1fr}
 .facts{grid-template-columns:repeat(2,1fr)}
 .fact:nth-child(2){border-right:0}.fact:nth-child(-n+2){border-bottom:1px solid var(--line)}
 .gallery{grid-template-columns:1fr}.gallery .tall{grid-row:auto;aspect-ratio:4/3}
 .verdict{flex-direction:column;align-items:flex-start}
 .about{grid-template-columns:1fr;gap:16px}.about-ph{width:110px;height:110px}
}

/* ===== stencil additions ===== */
.pagehero{max-width:760px;margin:0 auto;padding:48px 20px 8px}
.pagehero h1{font-size:clamp(34px,5.5vw,54px);line-height:1.08;letter-spacing:-.02em;margin-top:12px}
.pagehero .sub{display:flex;gap:14px;flex-wrap:wrap;color:var(--mute);font-size:14px;margin-top:12px;align-items:center}
.intro{max-width:760px;margin:0 auto;padding:8px 20px 0;font-size:17px;line-height:1.75}
.intro p{margin:0 0 20px}
.rank-list{max-width:760px;margin:0 auto;padding:24px 20px}
.rank{display:grid;grid-template-columns:56px 1fr;gap:18px;padding:32px 0;border-top:1px solid var(--line)}
.rank:first-child{border-top:0}
.rank .num{font-family:"DM Serif Display",Georgia,serif;font-size:40px;line-height:1;color:var(--mute)}
.rank .ph{aspect-ratio:16/9;background:var(--sand);border-radius:6px;overflow:hidden;margin:14px 0}
.rank .ph img{width:100%;height:100%;object-fit:cover}
.rank h2{font-size:26px}
.rank .meta{margin-top:4px}
.rank p.blurb{margin-top:12px;font-size:16px;line-height:1.7}
.rank .btns{margin-top:14px}
.rank .btn{padding:9px 16px;font-size:13px}
@media (max-width:760px){.rank{grid-template-columns:36px 1fr;gap:12px}.rank .num{font-size:28px}}

</style>
</head>
<body>

<header><div class="wrap nav">
<a class="brand" href="/">DXB Food Diary</a>
<ul id="menu"><li><a href="/#reviews" onclick="closeMenu()">Reviews</a></li><li><a href="/#guides" onclick="closeMenu()">Guides</a></li><li><a href="/#areas" onclick="closeMenu()">Areas</a></li><li><a href="/#mapsec" onclick="closeMenu()">Map</a></li><li><a href="/#about" onclick="closeMenu()">About</a></li></ul>
<button class="burger" aria-label="Menu" aria-expanded="false" onclick="toggleMenu()">☰</button>
</div></header>

<main>
<article class="rev" id="article" style="display:none">
<p class="crumb" id="crumb"></p>
<h1 class="serif" id="rName"></h1>
<div class="sub" id="rSub"></div>
<div class="facts" id="rFacts"></div>
<div class="gallery" id="rGallery" style="grid-template-columns:1fr;display:none"><div class="tall" style="aspect-ratio:4/3"><img id="rImg" alt="" loading="lazy" style="width:100%;height:100%;object-fit:cover"></div></div>
<div class="prose" id="rProse"></div>
<div class="verdict" id="rVerdictBox" style="display:none"><div><p class="serif" id="rVerdict"></p><p class="meta" id="rRated"></p></div><span class="stars" id="rVStars"></span></div>
<div class="btns" id="rBtns"></div>
<div id="map" class="map" style="height:260px;display:none"></div>
<section class="related" id="related" style="display:none"><h2 class="serif">More from DXB Food Diary</h2>
<div class="grid" id="relGrid"></div></section>
</article>
<p id="notfound" class="rev" style="display:none">Review not found. <a href="/" style="border-bottom:1px solid var(--line)">Back to home</a>.</p>
</main>

<footer class="wrap"><span>© 2026 DXB Food Diary</span><span><a href="/#reviews">Reviews</a> · <a href="/#guides">Guides</a> · <a href="/#areas">Areas</a></span><span><a href="https://instagram.com/halalfooddiary" target="_blank" rel="noopener">Instagram</a> · <a href="https://tiktok.com/@halalfooddiary" target="_blank" rel="noopener">TikTok</a></span></footer>

<script src="/js/config.js"></script>
<script src="/js/track.js" defer></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
function toggleMenu(){var m=document.getElementById("menu");var o=m.classList.toggle("open");document.querySelector(".burger").setAttribute("aria-expanded",o)}
function closeMenu(){document.getElementById("menu").classList.remove("open");document.querySelector(".burger").setAttribute("aria-expanded","false")}
function esc(s){return (s||"").replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]})}
function starStr(r){var full=Math.round(r);var s="";for(var i=1;i<=5;i++)s+=(i<=full?"\u2605":"\u2606");return s}
(function(){
  if("scrollRestoration" in history){history.scrollRestoration="manual"}
  window.scrollTo(0,0);
  var qs=new URLSearchParams(location.search);
  var slug=qs.get("slug");
  if(!slug){
    var seg=location.pathname.replace(/^\/+|\/+$/g,"").split("/");
    var last=seg[seg.length-1]||"";
    if(last&&last.indexOf(".")===-1){slug=decodeURIComponent(last)}
  }
  if(!slug){document.getElementById("notfound").style.display="block";return}
  var base=DXB.SUPA_URL+"/rest/v1/reviews";
  var tok=null;
  if(qs.get("preview")==="1"){try{var raw=localStorage.getItem("sb-hkvvbtvrpfjovxqglmdg-auth-token");if(raw){tok=JSON.parse(raw).access_token}}catch(e){}}
  var h={apikey:DXB.SUPA_KEY,Authorization:"Bearer "+(tok||DXB.SUPA_KEY)};
  var pubFilter=tok?"":"&published=eq.true";
  fetch(base+"?slug=eq."+encodeURIComponent(slug)+pubFilter+"&select=*",{headers:h})
  .then(function(x){return x.json()})
  .then(function(rows){
    var r=rows&&rows[0];
    if(!r){document.getElementById("notfound").style.display="block";return}
    document.title=r.name+" review \u2013 "+(r.area||"Dubai")+" | DXB Food Diary";
    (function(){
      var canonical=location.origin+"/"+encodeURIComponent(slug);
      var lc=document.querySelector('link[rel=canonical]'); if(!lc){lc=document.createElement("link");lc.rel="canonical";document.head.appendChild(lc)} lc.href=canonical;
      var md=document.querySelector('meta[name=description]'); if(md){md.content=(r.verdict||r.blurb||(r.name+" review in "+(r.area||"Dubai")+"."))}
      var ld={
        "@context":"https://schema.org",
        "@type":"Review",
        "itemReviewed":{"@type":"Restaurant","name":r.name,"address":{"@type":"PostalAddress","addressLocality":r.area||"Dubai","addressCountry":"AE"},"servesCuisine":r.cuisine||undefined},
        "author":{"@type":"Organization","name":"DXB Food Diary"},
        "reviewRating":{"@type":"Rating","ratingValue":(+r.rating).toFixed(1),"bestRating":"5","worstRating":"1"},
        "datePublished":r.date_published||r.review_date,
        "dateModified":r.date_modified||r.date_published||r.review_date,
        "url":canonical
      };
      if(r.image_url){ld.itemReviewed.image=r.image_url.indexOf("http")===0?r.image_url:location.origin+"/"+r.image_url}
      var sc=document.createElement("script");sc.type="application/ld+json";sc.textContent=JSON.stringify(ld);document.head.appendChild(sc);
    })();
    document.getElementById("article").style.display="block";
    window.scrollTo(0,0);
    document.getElementById("crumb").innerHTML='<a href="/">Home</a> \u203a <a href="/#reviews">Reviews</a> \u203a '+esc(r.cuisine||"")+" \u203a "+esc(r.area||"");
    document.getElementById("rName").textContent=r.name;
    function fmtD(d){return d?new Date(d+"T00:00:00").toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"}):""}
    var pub=r.date_published||r.review_date;
    var mod=r.date_modified||r.review_date;
    var dt=fmtD(pub);
    var subHtml='<span class="stars" style="font-size:18px">'+starStr(r.rating)+'</span><span>'+(+r.rating).toFixed(1)+' / 5</span><span>\u00b7</span><span>Reviewed '+dt+'</span>';
    if(mod&&mod!==pub){subHtml+='<span>\u00b7</span><span>Updated '+fmtD(mod)+'</span>'}
    subHtml+='<span>\u00b7</span><span>Visited &amp; paid myself</span>';
    document.getElementById("rSub").innerHTML=subHtml;
    var facts="";
    if(r.area)facts+='<div class="fact"><small>Area</small><b>'+esc(r.area)+"</b></div>";
    if(r.cuisine)facts+='<div class="fact"><small>Cuisine</small><b>'+esc(r.cuisine)+"</b></div>";
    if(r.price)facts+='<div class="fact"><small>Price</small><b>'+esc(r.price)+"</b></div>";
    if(r.best_for)facts+='<div class="fact"><small>Best for</small><b>'+esc(r.best_for)+"</b></div>";
    document.getElementById("rFacts").innerHTML=facts;
    var imgs=[];
    if(r.image_url)imgs.push({u:r.image_url.indexOf("http")===0?r.image_url:"/"+r.image_url,f:(r.focus_x==null?50:r.focus_x)+"% "+(r.focus_y==null?50:r.focus_y)+"%"});
    (Array.isArray(r.gallery)?r.gallery:[]).forEach(function(u){imgs.push({u:u.indexOf("http")===0?u:"/"+u,f:"50% 50%"})});
    if(imgs.length){
      var g=document.getElementById("rGallery");
      g.style.display="grid";g.style.gap="10px";
      g.style.gridTemplateColumns=imgs.length>1?"1fr 1fr":"1fr";
      g.innerHTML=imgs.map(function(im,i){
        var span=i===0?"grid-column:1/-1;":"";
        var ar=i===0?"aspect-ratio:16/10":"aspect-ratio:4/3";
        return '<div style="'+span+ar+';overflow:hidden;border-radius:12px;background:var(--sand)"><img src="'+esc(im.u)+'" alt="'+esc(r.name)+'" loading="lazy" style="width:100%;height:100%;object-fit:cover;object-position:'+im.f+'"></div>';
      }).join("");
    }
    var prose="";
    var body=(r.body||"Full written review coming soon. In the meantime the score, prices and map below are live, and you can watch the visit on Instagram or TikTok.");
    body.split(/\n\s*\n/).forEach(function(p){
      p=p.trim();if(!p)return;
      if(p.indexOf("## ")===0){prose+='<h2 class="serif">'+esc(p.slice(3))+"</h2>"}
      else{prose+="<p>"+esc(p).replace(/\n/g,"<br>")+"</p>"}
    });
    if(r.order_items){
      var items=r.order_items.split(/\n/).map(function(x){return x.trim()}).filter(Boolean);
      if(items.length)prose+='<div class="order"><h3>What to order</h3><ul>'+items.map(function(i){return "<li>"+esc(i)+"</li>"}).join("")+"</ul></div>";
    }
    document.getElementById("rProse").innerHTML=prose;
    if(r.verdict||r.rating!=null){
      document.getElementById("rVerdictBox").style.display="flex";
      document.getElementById("rVerdict").textContent=r.verdict||(r.name+" scores "+(+r.rating).toFixed(1)+" out of 5.");
      document.getElementById("rRated").textContent="Rated "+(+r.rating).toFixed(1)+" of 5";
      document.getElementById("rVStars").textContent=starStr(r.rating);
    }
    var btns="";
    if(r.gmaps_url)btns+='<a class="btn solid" href="'+esc(r.gmaps_url)+'" target="_blank" rel="noopener">Open in Google Maps</a>';
    if(r.instagram_url)btns+='<a class="btn" href="'+esc(r.instagram_url)+'" target="_blank" rel="noopener">Watch on Instagram</a>';
    if(r.tiktok_url)btns+='<a class="btn" href="'+esc(r.tiktok_url)+'" target="_blank" rel="noopener">Watch on TikTok</a>';
    document.getElementById("rBtns").innerHTML=btns;
    if(r.lat&&r.lng){
      var el=document.getElementById("map");el.style.display="block";
      var map=L.map("map",{scrollWheelZoom:false}).setView([r.lat,r.lng],15);
      L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png",{attribution:"&copy; OpenStreetMap &copy; CARTO",maxZoom:19}).addTo(map);
      L.marker([r.lat,r.lng],{icon:L.divIcon({className:"",html:'<div class="pin"></div>',iconSize:[14,14],iconAnchor:[7,7]})}).addTo(map);
    }
    fetch(base+"?published=eq.true&slug=neq."+encodeURIComponent(slug)+"&select=slug,name,area,cuisine,rating,image_url,page_url&order=review_date.desc&limit=3",{headers:h})
    .then(function(x){return x.json()})
    .then(function(rel){
      if(!rel||!rel.length)return;
      document.getElementById("related").style.display="block";
      document.getElementById("relGrid").innerHTML=rel.map(function(q){
        var href=q.page_url?"/"+q.page_url:"/"+q.slug;
        var img=q.image_url?(q.image_url.indexOf("http")===0?q.image_url:"/"+q.image_url):"";
        return '<a class="card" href="'+href+'"><div class="ph">'+(img?'<img src="'+esc(img)+'" alt="'+esc(q.name)+'" loading="lazy">':"")+'</div><h3>'+esc(q.name)+'</h3><p class="meta">'+esc(q.area||"")+" \u00b7 "+esc(q.cuisine||"")+'</p><p class="meta"><span class="stars">\u2605</span> '+(+q.rating).toFixed(1)+" / 5</p></a>";
      }).join("");
    });
  })
  .catch(function(){document.getElementById("notfound").style.display="block"});
})();
</script>
</body>
</html>
